name: Security Pipeline

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks — segredos no histórico
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Bloquear credenciais expostas
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"

  semgrep:
    name: semgrep — análise estática
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:cab19964e6c93019934252a9cd591d9b27df1e5b5d1734b26f4069ae51c295f8 # 1.179.0 linux/amd64
    steps:
      - name: Checkout do código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bloquear padrões inseguros
        run: semgrep scan --config .semgrep.yml --error .

  trivy:
    name: trivy — CVEs críticos na imagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Construir imagem do commit
        run: docker build --pull --tag cp05-site:${{ github.sha }} .
      - name: Falhar se a imagem tiver CVE crítico
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cp05-site:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '1'
